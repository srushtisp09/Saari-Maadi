services:
  - type: web
    name: saari-maadi-api
    runtime: node
    plan: free
    buildCommand: npm --prefix server ci --omit=dev && npm --prefix server run build
    startCommand: npm --prefix server run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_AUTHORITY_PASSWORD
        sync: false
      - key: DEMO_CITIZEN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
